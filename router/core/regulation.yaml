# ============================================================================
# Grouter - Energy Regulation Algorithm
# ============================================================================
# Core regulation logic that adjusts router level based on grid power.
# ============================================================================

script:
  # --------------------------------------------------------------------------
  # Main Energy Regulation Script
  # --------------------------------------------------------------------------
  - id: energy_regulation
    mode: single
    then:
      - lambda: |-
          // Safety check: disable regulation if power readings are invalid or safety triggered
          if (isnan(id(real_power).state) || id(safety_limit)) {
            id(router_level).publish_state(0);
            const float duration = id(relay_duration).state;
            id(g_cd1) = duration;
            id(g_cd2) = duration;
            id(g_cd3) = duration;
            id(relay_1_countdown).publish_state(duration);
            id(relay_2_countdown).publish_state(duration);
            id(relay_3_countdown).publish_state(duration);
            return;
          }

          // Get current states
          const double power = id(real_power).state;
          const double target = id(target_grid_exchange).state;
          const double current_level = id(router_level).state;
          const double duration = id(relay_duration).state;

          // Select reactivity based on direction (can be asymmetric)
          const double react = (power >= target)
            ? id(down_reactivity).state
            : id(reactivity).state;

          // Calculate proportional adjustment
          const double delta = -(power - target) * react / ${regulation_power_divisor};

          // Apply delta and clamp to valid range
          double new_level = std::max(0.0, std::min(100.0, current_level + delta));

          // Threshold constants (compile-time)
          constexpr double threshold_1 = ${thresholds_relay_1};
          constexpr double threshold_2 = ${thresholds_relay_2};
          constexpr double threshold_3 = ${thresholds_relay_3};

          // Snap to relay thresholds when close from below
          constexpr double snap_margin = 1.0;
          if (new_level > threshold_1 - snap_margin && new_level < threshold_1) new_level = threshold_1;
          if (new_level > threshold_2 - snap_margin && new_level < threshold_2) new_level = threshold_2;
          if (new_level > threshold_3 - snap_margin && new_level < threshold_3) new_level = threshold_3;

          // Read countdowns from globals (not sensor state - avoids filter issues)
          double cd1 = id(g_cd1);
          double cd2 = id(g_cd2);
          double cd3 = id(g_cd3);

          if (new_level >= threshold_3) {
            cd3 -= 1;
            cd2 = 0;
            cd1 = 0;
          } else if (new_level >= threshold_2) {
            if (cd2 > 0) new_level = threshold_2;
            cd3 = duration;
            cd2 -= 1;
            cd1 = 0;
          } else if (new_level >= threshold_1) {
            if (cd1 > 0) new_level = threshold_1;
            cd3 = duration;
            cd2 = duration;
            cd1 -= 1;
          } else {
            cd3 = duration;
            cd2 = duration;
            cd1 = duration;
          }

          // Clamp countdowns
          if (cd1 < 0) cd1 = 0;
          if (cd2 < 0) cd2 = 0;
          if (cd3 < 0) cd3 = 0;

          // Store back to globals
          id(g_cd1) = cd1;
          id(g_cd2) = cd2;
          id(g_cd3) = cd3;

          // Update display sensors
          id(relay_1_countdown).publish_state(cd1);
          id(relay_2_countdown).publish_state(cd2);
          id(relay_3_countdown).publish_state(cd3);

          // Always publish to trigger on_value relay logic
          // (relay activation depends on on_value seeing updated countdowns)
          id(router_level).publish_state(new_level);

# --------------------------------------------------------------------------
# Regulation Trigger (Fallback)
# --------------------------------------------------------------------------
interval:
  - interval: ${regulation_interval}s
    then:
      - if:
          condition:
            switch.is_on: activate
          then:
            - script.execute: energy_regulation
