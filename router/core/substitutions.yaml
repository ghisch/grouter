# ============================================================================
# Grouter - Global Substitutions & Constants
# ============================================================================
# All configurable values and magic numbers are defined here.
# Override these via package vars in your device configuration.
# ============================================================================

substitutions:
  # --------------------------------------------------------------------------
  # Hardware Pin Configuration
  # --------------------------------------------------------------------------
  pins:
    # AC Dimmer / Triac
    regulator_gate: "GPIO42"
    regulator_zero_crossing: "GPIO41"
    # Relays (active LOW)
    relay_1: "GPIO40"
    relay_2: "GPIO39"
    relay_3: "GPIO38"

  # --------------------------------------------------------------------------
  # Home Assistant Sensors
  # --------------------------------------------------------------------------
  sensors:
    # Grid power exchange (positive = importing, negative = exporting)
    grid_power: "sensor.grid_power"
    # Total home consumption
    consumption: "sensor.home_consumption"
    # Forced run control sensor
    force_run: "binary_sensor.force_run"

  # --------------------------------------------------------------------------
  # Relay Thresholds (percentage)
  # --------------------------------------------------------------------------
  # For a 3-resistor setup (e.g., 3x 800W = 2400W total):
  #   0-33.33%   : Dimmer only (0-800W)
  #   33.33-66.66%: Relay 1 ON + Dimmer (800-1600W)
  #   66.66-100% : Relay 1+2 ON + Dimmer (1600-2400W)
  #   100%       : All relays ON, dimmer bypassed
  thresholds:
    relay_1: "33.33333333"
    relay_2: "66.66666666"
    relay_3: "100.0"

  # --------------------------------------------------------------------------
  # Regulation Parameters
  # --------------------------------------------------------------------------
  regulation:
    # Total load power in watts (used for delta calculation)
    power_divisor: "3000"
    # Fallback regulation interval in seconds (primary is on_value trigger)
    interval: "10"

  # --------------------------------------------------------------------------
  # Relay Anti-Cycling Protection (in regulation cycles)
  # --------------------------------------------------------------------------
  # Number of regulation cycles before a relay can be re-enabled.
  # Prevents rapid cycling that could damage relays or cause flicker.
  #
  # NOTE: This is NOT in seconds! One regulation cycle occurs when:
  #   - Power meter value changes (reactive trigger)
  #   - OR every ${regulation.interval} seconds (fallback trigger)
  #
  # Example: With interval=10s and frequent power updates, 30 cycles
  # might complete in 30-300 seconds depending on power meter activity.
  relay:
    anti_cycle_duration: "30"

  # --------------------------------------------------------------------------
  # Forced Run Schedule (Cron format)
  # --------------------------------------------------------------------------
  # Format: "seconds minutes hours day_of_month month day_of_week"
  forced_run:
    on_cron: "0 0 2 * * *"   # 02:00 AM - Start forced heating
    off_cron: "0 0 6 * * *"  # 06:00 AM - Stop forced heating

  # --------------------------------------------------------------------------
  # Energy Counter
  # --------------------------------------------------------------------------
  energy:
    default_load_power: "2400"

  # --------------------------------------------------------------------------
  # Power Meter
  # --------------------------------------------------------------------------
  power_meter:
    activated_at_start: "false"
