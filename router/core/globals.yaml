# ============================================================================
# Grouter - Global Variables
# ============================================================================
# Runtime state variables shared across components.
# ============================================================================

globals:
  # Safety limit flag - set to true to immediately stop all regulation
  # Can be controlled by temperature sensors or other safety mechanisms
  - id: safety_limit
    type: bool
    initial_value: "false"

  # Power meter activation state
  # Tracks whether the solar routing is actively measuring power
  - id: power_meter_activated
    type: bool
    initial_value: ${power_meter_activated_at_start}
    restore_value: true

  # Relay countdown trackers (in regulation cycles)
  # Using globals instead of sensor state to avoid filter chain issues
  - id: g_cd1
    type: float
    initial_value: "${relay_anti_cycle_duration}"
  - id: g_cd2
    type: float
    initial_value: "${relay_anti_cycle_duration}"
  - id: g_cd3
    type: float
    initial_value: "${relay_anti_cycle_duration}"
